name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact Python identities
        run: python3 -B python/check_all.py
      - name: Verify committed generated pages
        run: python3 tools/build_site.py --check --no-archive
      - name: Generate source download and verify site
        run: |
          python3 tools/build_site.py
          python3 tools/check_site.py
      - name: Make room for Lean and mathlib
        run: |
          df -h .
          # These SDKs are unused by this job on the disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h .
          python3 - <<'PY'
          import shutil
          free_gib = shutil.disk_usage('.').free / 2**30
          print(f'Available before Lean setup: {free_gib:.1f} GiB')
          # The toolchain, mathlib and project builds already need about 18 GiB;
          # leave headroom for dependency checkouts and cache archives as well.
          if free_gib < 30:
              raise SystemExit('::error::Need at least 30 GiB free before the Lean build.')
          PY
      - name: Install Lean, fetch pinned dependencies and build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Audit all project declarations
        working-directory: lean
        run: lake env lean -j1 -M8192 Audit.lean
      - name: Compare a fresh Lean export with the publication snapshot
        working-directory: lean
        env:
          BOUNDARY_OUTPUT: ${{ runner.temp }}/ls-dim14-kernel.json
        run: |
          lake env lean -j1 -M8192 tools/ExportBoundary.lean
          cmp ../site-data/kernel.json "$BOUNDARY_OUTPUT"
      - name: Report Lean disk usage
        if: always()
        run: |
          df -h .
          du -sh lean/.lake "$HOME/.elan" "$HOME/.cache/mathlib" 2>/dev/null || true
      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
