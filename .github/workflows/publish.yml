name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact Python identities
        run: python3 -B python/check_all.py
      - name: Install Lean, fetch pinned dependencies and build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Audit all project declarations
        working-directory: lean
        run: lake env lean -j1 -M8192 Audit.lean
      - name: Compare a fresh Lean export with the publication snapshot
        working-directory: lean
        env:
          BOUNDARY_OUTPUT: ${{ runner.temp }}/ls-dim14-kernel.json
        run: |
          lake env lean -j1 -M8192 tools/ExportBoundary.lean
          cmp ../site-data/kernel.json "$BOUNDARY_OUTPUT"
      - name: Verify committed generated pages
        run: python3 tools/build_site.py --check --no-archive
      - name: Generate source download and verify site
        run: |
          python3 tools/build_site.py
          python3 tools/check_site.py
      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
